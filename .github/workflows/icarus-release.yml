name: Icarus release
run-name: Icarus release (${{ github.ref_name }})

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - .github/workflows/icarus-release.yml
      - apps/app/tauri-release.conf.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icarus-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  SQLX_OFFLINE: 'true'
  SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
  # Only a main commit titled "Release Icarus v0.22.0" bootstraps this version.
  # Repeat the marker after native-code fixes; publishing still requires verified signatures.
  ICARUS_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Icarus v0.22.0') && 'v0.22.0' || '') }}

jobs:
  build:
    if: github.repository == 'fraa2a/Icarus'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          target: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Set release version and app environment
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          if os.environ['ICARUS_RELEASE_TAG']:
              tag = os.environ['ICARUS_RELEASE_TAG']
              if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?', tag):
                  raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH, optionally with a prerelease suffix')
              version = tag[1:]
              for name in ('apps/app/Cargo.toml', 'packages/app-lib/Cargo.toml'):
                  path = Path(name)
                  text, count = re.subn(r'^version = "[^"]+"', f'version = "{version}"', path.read_text(), count=1, flags=re.M)
                  if count != 1:
                      raise SystemExit(f'Cannot set version in {name}')
                  path.write_text(text)
              path = Path('apps/app-frontend/package.json')
              package = json.loads(path.read_text())
              package['version'] = version
              path.write_text(json.dumps(package, indent='\t') + '\n')

          Path('packages/app-lib/.env').write_bytes(Path('packages/app-lib/.env.prod').read_bytes())
          PY

      - name: Install app dependencies
        run: pnpm --filter @modrinth/monorepo --filter @modrinth/app... install --frozen-lockfile

      - name: Generate language coverage data
        run: pnpm i18n:coverage

      - name: Build signed app bundles
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '::error::Set the TAURI_PRIVATE_KEY repository secret before building updates'
            exit 1
          fi
          pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'

      - name: Upload signed bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icarus-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.AppImage*
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz*
            target/${{ matrix.target }}/release/bundle/**/*-setup.exe*
            target/${{ matrix.target }}/release/bundle/**/*.nsis.zip*

  verify:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download signed bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: icarus-*
          path: bundles

      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Verify signatures and generate update manifest
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import shutil
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          config = json.loads(Path('apps/app/tauri-release.conf.json').read_text())
          public_key = Path('updater.pub')
          public_key.write_bytes(base64.b64decode(config['plugins']['updater']['pubkey'], validate=True))
          bundles = Path('bundles')
          assets = Path('release-assets')
          assets.mkdir()
          for path in bundles.rglob('*'):
              if path.is_file():
                  destination = assets / path.name
                  if destination.exists():
                      raise SystemExit(f'Duplicate release asset: {path.name}')
                  shutil.copyfile(path, destination)

          tag = os.environ['ICARUS_RELEASE_TAG'] or os.environ['GITHUB_REF_NAME']
          version = tag[1:] if os.environ['ICARUS_RELEASE_TAG'] else '1.0.0-local'
          base_url = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{quote(tag, safe="")}/'

          def find_one(pattern):
              matches = list(assets.glob(pattern))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {pattern} asset, found {len(matches)}')
              return matches[0]

          platforms = {}
          for targets, pattern, installers in (
              (('linux-x86_64',), '*.AppImage.tar.gz', ('*.AppImage', '*.deb', '*.rpm')),
              (('windows-x86_64',), '*.nsis.zip', ('*-setup.exe',)),
              (('darwin-x86_64', 'darwin-aarch64'), '*.app.tar.gz', ('*.dmg',)),
          ):
              bundle = find_one(pattern)
              signature = bundle.with_name(bundle.name + '.sig').read_text().strip()
              decoded_signature = Path('updater.sig')
              decoded_signature.write_bytes(base64.b64decode(signature, validate=True))
              subprocess.run(['minisign', '-Vm', str(bundle), '-p', str(public_key), '-x', str(decoded_signature)], check=True)
              entry = {
                  'signature': signature,
                  'url': base_url + quote(bundle.name, safe=''),
                  'install_urls': [base_url + quote(find_one(pattern).name, safe='') for pattern in installers],
              }
              for target in targets:
                  platforms[target] = entry

          manifest = {
              'version': version,
              'notes': '',
              'pub_date': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': platforms,
          }
          (assets / 'latest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(f'Verified {len(platforms)} update targets for {version}')
          PY

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icarus-verified-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.event_name == 'push' && (github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Icarus v0.22.0')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.22.0' }}
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: icarus-verified-release
          path: release-assets

      - name: Prepare draft release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if ! jq -e '.isDraft == true' release-state.json; then
              echo '::error::This release is already published; refusing to replace its signed assets'
              exit 1
            fi
          else
            if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "Icarus ${RELEASE_TAG#v}" --generate-notes
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Icarus ${RELEASE_TAG#v}" --generate-notes
            fi
          fi
          gh release view "$RELEASE_TAG" --json body --jq '.body' > release-notes.md
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('release-assets/latest.json')
          manifest = json.loads(path.read_text())
          manifest['notes'] = Path('release-notes.md').read_text()
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Publish complete release
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

  publish-aur:
    needs: publish
    if: github.event_name == 'push' && (github.ref_type == 'tag' && !contains(github.ref_name, '-') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Icarus v0.22.0')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.22.0' }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check AUR credentials
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo '::error::Set the AUR_SSH_PRIVATE_KEY repository secret'
            exit 1
          fi

      - name: Download published Debian package
        run: |
          version="${RELEASE_TAG#v}"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .isDraft' | grep -qx false
          gh release download "$RELEASE_TAG" --pattern "Icarus_${version}_amd64.deb" --dir release-package
          ar t "release-package/Icarus_${version}_amd64.deb" | grep -Eq '^data\.tar\.(gz|xz|zst)$'

      - name: Clone existing AUR package
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aur-key"
          ssh-keyscan -T 15 -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/aur-known-hosts"
          # Official AUR Ed25519 fingerprint: https://archlinux.org/news/aur-migration-new-ssh-hostkeys/
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/aur-known-hosts" -E sha256 | awk '{print $2}')"
          if [[ "$fingerprint" != 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' ]]; then
            echo '::error::AUR SSH host key fingerprint mismatch'
            exit 1
          fi
          cat > "$RUNNER_TEMP/aur-ssh-config" <<EOF
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile $RUNNER_TEMP/aur-key
            IdentitiesOnly yes
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/aur-known-hosts
          EOF
          export GIT_SSH_COMMAND="ssh -F $RUNNER_TEMP/aur-ssh-config"
          git clone ssh://aur@aur.archlinux.org/icarus-launcher-bin.git aur-package
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >> "$GITHUB_ENV"

      - name: Update PKGBUILD and .SRCINFO
        run: |
          python - <<'PY'
          import os
          import re
          from hashlib import sha256
          from pathlib import Path

          version = os.environ['RELEASE_TAG'].removeprefix('v')
          deb = Path('release-package') / f'Icarus_{version}_amd64.deb'
          checksum = sha256(deb.read_bytes()).hexdigest()
          path = Path('aur-package/PKGBUILD')
          contents = path.read_text()
          replacements = {
              r'^pkgver=.*$': f'pkgver={version}',
              r'^pkgrel=.*$': 'pkgrel=1',
              r'^url=.*$': "url='https://github.com/fraa2a/Icarus'",
              r'^license=.*$': "license=('GPL-3.0-only')",
              r'^source=.*$': 'source=("${_pkgname}_${pkgver}_amd64.deb::${url}/releases/download/v${pkgver}/${_pkgname}_${pkgver}_amd64.deb")',
              r'^sha256sums=.*$': f"sha256sums=('{checksum}')",
          }
          for pattern, replacement in replacements.items():
              contents, count = re.subn(pattern, lambda _: replacement, contents, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Expected exactly one PKGBUILD line for {pattern}: {count}')
          path.write_text(contents)
          PY
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/aur-package:/pkg" -w /pkg archlinux:base-devel makepkg --printsrcinfo > aur-package/.SRCINFO
          grep -Fq "pkgver = ${RELEASE_TAG#v}" aur-package/.SRCINFO

      - name: Publish AUR package
        working-directory: aur-package
        run: |
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'AUR package already matches this release'
            exit 0
          fi
          git -c user.name='Icarus Release Bot' -c user.email='actions@users.noreply.github.com' commit -m "Update Icarus to ${RELEASE_TAG#v}"
          git push origin HEAD:master
